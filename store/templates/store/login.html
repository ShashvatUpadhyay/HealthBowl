{% extends 'store/base.html' %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            
            <div class="card border-0 shadow-lg rounded-4 p-3 p-md-4">
                <div class="card-body">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-1">Welcome Back</h2>
                        <p class="text-muted small">Login with your email to continue</p>
                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger py-2 rounded-3 text-center small mb-3">
                            Incorrect email or password.
                        </div>
                    {% endif %}

                    <form method="POST" action="">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label small text-muted fw-bold ms-2">Email Address</label>
                            <input type="email" name="username" class="form-control rounded-pill px-3 py-2 bg-light border-0" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small text-muted fw-bold ms-2">Password</label>
                            <input type="password" name="password" class="form-control rounded-pill px-3 py-2 bg-light border-0" placeholder="Enter password..." required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark rounded-pill py-2 fw-bold shadow-sm">
                                Login
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Don't have an account?</p>
                        <a href="{% url 'register' %}" class="fw-bold text-success text-decoration-none">Create Account</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
