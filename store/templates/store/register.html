{% extends 'store/base.html' %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            
            <div class="card border-0 shadow-lg rounded-4 p-3 p-md-4">
                <div class="card-body">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-1">Create Account</h2>
                        <p class="text-muted small">Join FreshBowl today!</p>
                    </div>

                    <form method="POST" action="">
                        {% csrf_token %}
                        
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label small text-muted fw-bold ms-2">{{ field.label }}</label>
                                {{ field }}
                                {% for error in field.errors %}
                                    <div class="text-danger small ms-2 mt-1">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success rounded-pill py-2 fw-bold shadow-sm">
                                Sign Up
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Already have an account?</p>
                        <a href="{% url 'login' %}" class="fw-bold text-dark text-decoration-none">Login Here</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
