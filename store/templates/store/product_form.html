{% extends 'store/base.html' %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-4 p-4">
                <div class="card-body">
                    <h3 class="fw-bold mb-4">{{title}}</h3>
                    
                    <form method="POST" action="" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">{{field.label}}</label>
                            {{field}}
                        </div>
                        {% endfor %}

                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-success rounded-pill py-3 fw-bold" type="submit">
                                Save Product
                            </button>
                            <a href="{% url 'dashboard' %}" class="btn btn-outline-dark rounded-pill py-3">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
